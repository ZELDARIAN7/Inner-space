# Render Blueprint for Inner Space — one web service: the Node server serves the app and the AI/voice API.
# Render → New → Blueprint → pick this repo. It asks for the secret values marked "sync: false".
services:
  - type: web
    name: inner-space
    runtime: node
    plan: starter            # $7/month. The free plan sleeps after 15 min and cannot keep the voice cache.
    region: frankfurt        # closest Render region to the Gulf / Middle East
    buildCommand: echo "nothing to build"
    startCommand: node server/server.js
    healthCheckPath: /api/health
    disk:
      name: inner-space-data # every voice line and translation is kept here, so each is paid for once
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID   # Brian — English (and Arabic, if no Arabic voice is set)
        value: nPczCjzI2devNBz1zQrb
      - key: ELEVENLABS_VOICE_AR   # your Arabic voice's ID from ElevenLabs → My Voices
        sync: false
      - key: ADMIN_TOKEN           # lets only you open /api/voice/status and /api/guard
        generateValue: true
      - key: LIMIT_AI_PER_HOUR
        value: "30"
      - key: LIMIT_AI_PER_DAY
        value: "120"
      - key: LIMIT_AI_SERVER_PER_DAY
        value: "3000"
      - key: LIMIT_VOICE_CHARS_PER_DAY
        value: "15000"
      - key: LIMIT_VOICE_SERVER_CHARS_PER_DAY
        value: "200000"
